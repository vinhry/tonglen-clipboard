<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tonglen" />
  <meta name="theme-color" content="#030712" />
  <title>Tonglen Clipboard</title>
  <link rel="stylesheet" href="tailwindcss" />
</head>
<body class="h-full bg-gray-950 text-gray-100 antialiased">

  <!-- ══════════ JOIN SCREEN ══════════ -->
  <div id="join-screen" class="flex min-h-full items-center justify-center px-4">
    <div class="w-full max-w-md space-y-8">
      <!-- Logo -->
      <div class="text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center">
          <img id="logo-join" alt="Tonglen Clipboard" class="h-16 w-16 rounded-2xl" />
        </div>
        <h1 class="mt-4 text-2xl font-bold tracking-tight text-white">Tonglen Clipboard</h1>
        <p class="mt-2 text-sm text-gray-400">Share text and files across devices on your network</p>
      </div>

      <!-- Form -->
      <div class="space-y-4 rounded-2xl border border-gray-800 bg-gray-900 p-6">
        <div>
          <label for="input-name" class="block text-sm font-medium text-gray-300">Display Name</label>
          <input id="input-name" type="text" maxlength="30" placeholder="Enter your name"
            class="mt-1 block w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500" />
        </div>
        <div>
          <label for="input-room" class="block text-sm font-medium text-gray-300">Room Code</label>
          <div class="mt-1 flex gap-2">
            <input id="input-room" type="text" maxlength="50" placeholder="Enter or generate a code"
              class="block w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500" />
            <button id="btn-random-room" type="button"
              class="shrink-0 rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-xs text-gray-400 hover:border-amber-500 hover:text-amber-400 transition"
              title="Generate random code">
              <i data-lucide="dices" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
        <button id="btn-join" type="button"
          class="w-full rounded-lg bg-amber-500 px-4 py-2.5 text-sm font-semibold text-gray-950 hover:bg-amber-400 transition disabled:opacity-50 disabled:cursor-not-allowed">
          Join Room
        </button>
      </div>

      <!-- Server info -->
      <div id="server-info" class="text-center text-xs text-gray-500"></div>
    </div>
  </div>

  <!-- ══════════ MAIN SCREEN ══════════ -->
  <div id="main-screen" class="hidden h-full flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between gap-3 border-b border-gray-800 bg-gray-900 px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))]">
      <div class="flex min-w-0 items-center gap-3">
        <button id="btn-mobile-peers" type="button"
          class="rounded-lg border border-gray-700 bg-gray-800 p-1.5 text-gray-400 hover:border-amber-500 hover:text-amber-400 transition lg:hidden"
          title="Room info" aria-label="Show room info, peers and settings">
          <i data-lucide="panel-left" class="h-4 w-4"></i>
        </button>
        <img id="logo-header" alt="" class="hidden h-6 w-6 rounded sm:block" />
        <div class="min-w-0">
          <button id="btn-room-code" type="button" title="Copy share link"
            class="group flex max-w-full items-center gap-1.5 rounded-md text-left font-mono text-sm font-semibold text-white hover:text-amber-400 transition">
            <span id="header-room" class="truncate"></span>
            <i data-lucide="copy" class="h-3.5 w-3.5 shrink-0 text-gray-500 group-hover:text-amber-400"></i>
          </button>
          <div class="flex items-center gap-2 text-xs text-gray-400">
            <span id="header-status" class="flex items-center gap-1">
              <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
              Connected
            </span>
            <span aria-hidden="true">·</span>
            <span id="header-peers-count">0 peers</span>
          </div>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button id="btn-copy-link" type="button"
          class="inline-flex items-center gap-1 rounded-lg border border-gray-700 bg-gray-800 p-2 sm:px-3 sm:py-1.5 text-xs text-gray-300 hover:border-amber-500 hover:text-amber-400 transition"
          title="Copy share link">
          <span data-icon class="contents"><i data-lucide="link" class="h-4 w-4 sm:h-3.5 sm:w-3.5"></i></span><span data-label class="hidden sm:inline">Copy Link</span>
        </button>
        <button id="btn-leave" type="button"
          class="inline-flex items-center gap-1 rounded-lg border border-gray-700 bg-gray-800 p-2 sm:px-3 sm:py-1.5 text-xs text-gray-300 hover:border-red-500 hover:text-red-400 transition"
          title="Leave room">
          <i data-lucide="log-out" class="h-4 w-4 sm:h-3.5 sm:w-3.5"></i><span class="hidden sm:inline">Leave</span>
        </button>
      </div>
    </header>

    <!-- Body: sidebar + feed -->
    <div class="relative flex flex-1 overflow-hidden">

      <!-- Sidebar (static on desktop, slide-in drawer on mobile) -->
      <div id="drawer-backdrop" class="fixed inset-0 z-30 hidden bg-black/60 lg:hidden"></div>
      <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-gray-800 bg-gray-900 transition-transform duration-200 lg:static lg:z-auto lg:translate-x-0 lg:bg-gray-900/50">
        <div class="flex items-center justify-between border-b border-gray-800 p-4 pt-[max(1rem,env(safe-area-inset-top))] lg:hidden">
          <h3 class="text-sm font-semibold text-white">Room</h3>
          <button id="btn-close-drawer" type="button" class="text-gray-400 hover:text-white" aria-label="Close">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>

        <!-- QR Code -->
        <div class="border-b border-gray-800 p-4">
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Scan to Join</h3>
          <div id="qr-container" class="mx-auto flex aspect-square max-w-48 items-center justify-center rounded-lg bg-white p-3"></div>
          <p id="share-url" class="mt-2 truncate text-center text-xs text-gray-500"></p>
        </div>

        <!-- Peers -->
        <div class="flex-1 overflow-y-auto p-4">
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Connected Peers</h3>
          <ul id="peers-list" class="space-y-1"></ul>
        </div>

        <!-- Settings -->
        <div class="border-t border-gray-800 p-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Settings <span id="settings-owner-hint" class="text-amber-500/60 normal-case font-normal">(owner only)</span></h3>
          <label for="file-expiry" class="block text-xs text-gray-400 mb-1">Auto-cleanup after</label>
          <select id="file-expiry"
            class="w-full rounded-lg border border-gray-700 bg-gray-800 px-2 py-1.5 text-sm text-white focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500">
            <option value="1">1 minute</option>
            <option value="5" selected>5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="360">6 hours</option>
            <option value="720">12 hours</option>
            <option value="1440">24 hours</option>
          </select>
          <label for="max-upload-size" class="block text-xs text-gray-400 mb-1 mt-3">Max upload size</label>
          <select id="max-upload-size"
            class="w-full rounded-lg border border-gray-700 bg-gray-800 px-2 py-1.5 text-sm text-white focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500">
            <option value="1">1 MB</option>
            <option value="5">5 MB</option>
            <option value="10">10 MB</option>
            <option value="25">25 MB</option>
            <option value="50">50 MB</option>
            <option value="100" selected>100 MB</option>
            <option value="500">500 MB</option>
            <option value="1024">1 GB</option>
            <option value="5120">5 GB</option>
            <option value="10240">10 GB</option>
          </select>
        </div>
      </aside>

      <!-- Feed + composer -->
      <main class="flex min-w-0 flex-1 flex-col overflow-hidden">
        <div id="feed" class="flex-1 overflow-y-auto px-3 py-4 sm:px-6" aria-live="polite"></div>

        <!-- Composer -->
        <div class="border-t border-gray-800 bg-gray-900/60 px-3 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:px-6">
          <div class="mx-auto max-w-3xl">
            <div class="mb-2 flex items-center justify-between gap-2 text-xs text-gray-500">
              <label class="flex cursor-pointer select-none items-center gap-2 text-gray-400" title="When on, pasting anywhere outside the text box shares it immediately">
                <input id="toggle-watch" type="checkbox" checked class="h-3.5 w-3.5 accent-amber-500" />
                Auto-share on paste
              </label>
              <span id="composer-hint" class="truncate text-right">Max <span id="max-upload-label">100 MB</span> · clears after <span id="expiry-label">5 minutes</span></span>
            </div>
            <div id="composer"
              class="flex items-end gap-1.5 rounded-2xl border border-gray-700 bg-gray-800 p-1.5 transition focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500">
              <label title="Attach files" aria-label="Attach files"
                class="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-xl text-gray-400 hover:bg-gray-700 hover:text-amber-400 transition">
                <i data-lucide="paperclip" class="h-5 w-5"></i>
                <input id="file-input" type="file" class="hidden" multiple />
              </label>
              <button id="btn-paste" type="button" title="Share what's on your clipboard" aria-label="Share clipboard contents"
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-gray-400 hover:bg-gray-700 hover:text-amber-400 transition">
                <i data-lucide="clipboard-paste" class="h-5 w-5"></i>
              </button>
              <textarea id="input-text" rows="1" placeholder="Type, paste, or drop files…" aria-label="Message"
                class="block max-h-48 min-h-9 w-full resize-none bg-transparent px-2 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"></textarea>
              <button id="btn-send" type="button" title="Send (Enter)" aria-label="Send" disabled
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-amber-500 text-gray-950 hover:bg-amber-400 transition disabled:cursor-not-allowed disabled:bg-gray-700 disabled:text-gray-500">
                <i data-lucide="arrow-up" class="h-5 w-5"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Drop overlay -->
  <div id="drop-overlay" class="pointer-events-none fixed inset-0 z-50 hidden items-center justify-center bg-gray-950/80 p-6 backdrop-blur-sm">
    <div class="flex h-full w-full flex-col items-center justify-center rounded-3xl border-2 border-dashed border-amber-500 bg-amber-500/5 text-amber-400">
      <i data-lucide="upload-cloud" class="h-12 w-12"></i>
      <p class="mt-3 text-lg font-semibold">Drop to share with the room</p>
    </div>
  </div>

  <!-- Toasts -->
  <div id="alert-container" class="pointer-events-none fixed inset-x-4 top-4 z-50 flex flex-col items-end gap-2 sm:left-auto"></div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
